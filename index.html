$('settings-btn').onclick=()=>{if(editMode&&!editorPassword){editorPassword=prompt('請輸入小 T 的管理密碼')||'';if(!editorPassword)return}sound('click');showModal('小 T 的製作人設定',`<p class="settings-note">${remoteEdit?'手機雲端編輯模式：選好內容後按「發布到網站」，其他裝置重新打開就會同步更新。':editMode?'GitHub Pages 靜態編輯模式：設定只儲存在這台裝置；下載的 HTML 可離線保存；要同步給其他裝置，需重新上傳至 GitHub 發布。':'設定只會儲存在目前裝置的瀏覽器，不會同步給其他人。補齊後可下載完整玩家版 HTML；要更新這個網址，需把新版上傳到 GitHub。'}</p><div class="form-grid">${setting('遊戲登入密碼','set-password',cfg.password)}${setting('支付寶正式跳轉連結（可稍後填）','set-url',cfg.alipayUrl)}</div>${fileSetting('支付寶正式二維碼圖片','set-qr',!!cfg.qrImage)}<div class="settings-section"><h3>背景音樂</h3><p>選擇你合法持有的音訊檔。登入至 Game3 播放《Someone in the Crowd》，Game4 自動切換《Off My Face》，最後一頁切換《Fly Me to the Moon》。</p>${audioSetting('Login 至 Game3 · Someone in the Crowd','set-game-bgm',!!cfg.gameBgm)}${audioSetting('Game4 · Justin Bieber〈Off My Face〉','set-game4-bgm',!!cfg.game4Bgm)}${audioSetting('生日結尾 · Fly Me to the Moon','set-ending-bgm',!!cfg.endingBgm)}</div><div class="settings-section"><h3>前三關 · 懸賞令中的特寫照片</h3><p>照片指引實物；實物上的線索不會在玩家頁面提前顯示。圖片未補齊時使用明確標示的佔位圖。</p>${cfg.clues.map((c,i)=>`<div class="settings-section"><strong>Game${i+1} · ${esc(c.object)}</strong>${fileSetting('替換特寫照片','set-clue-photo-'+i,!!c.photo)}${setting('玩家找到物品前看到的小提示','set-prompt-'+i,c.prompt,true)}<p>藏在實物上的內容：<b>${esc(c.physical)}</b></p></div>`).join('')}</div><div class="settings-section"><h3>Game3 · 四張合照</h3><div class="form-grid">${cfg.photos.map((p,i)=>fileSetting('第 '+(i+1)+' 張合照','set-photo-'+i,!!p)).join('')}</div></div><div class="settings-section"><h3>生日結尾</h3>${fileSetting('結尾合照（未加入時保留設計稿中的像素人物）','set-ending-photo',!!cfg.endingPhoto)}${setting('給 Kyle 的信','set-letter',cfg.letter,true)}${setting('旁邊的小紙條','set-short-letter',cfg.shortLetter,true)}</div><div class="settings-section"><h3>製作預覽</h3><p>以下按鈕供你跳轉試玩。遊玩會記錄進度；交給 Kyle 前可按「重新開機」清除。</p><div class="preview-buttons">${[['login','登入'],['battle','Game1'],['football','Game2'],['memory','Game3'],['earth','Game4 地球'],['rescue','Game4 太空'],['clue','懸賞令'],['ending','生日結尾']].map(([value,label])=>`<button class="xpbutton" data-preview="${value}">${label}</button>`).join('')}</div></div><p class="status" id="settings-status" role="status"></p><div class="settings-actions"><button class="xpbutton" id="settings-save">${remoteEdit?'發布到網站':'儲存設定'}</button><button class="pink-button" id="settings-export">下載玩家版 HTML</button></div><p class="font-credit">字體：Fusion Pixel，SIL OFL 1.1。字型與素材已內嵌，可離線使用。</p>`);const readers=[];for(const el of $('modal-body').querySelectorAll('input[type=file]')){el.addEventListener('change',()=>{el.parentElement.querySelector('.file-status').textContent=el.files[0]?.name||'保留原圖片。'})}document.querySelectorAll('[data-preview]').forEach(el=>el.onclick=()=>{$('modal').close();const map={login:renderLogin,battle:renderBattle,football:renderFootball,memory:renderMemory,earth:renderEarth,rescue:renderRescue,clue:()=>renderClue(0),ending:renderEnding};map[el.dataset.preview]()});$('settings-save').onclick=async()=>{const c=await collectSettings();if(!c)return;$('settings-save').disabled=true;$('settings-status').textContent=editMode?'正在發布，請不要關閉頁面…':'正在儲存…';try{cfg=c;if(remoteEdit){await saveRemote(c);$('settings-status').textContent='發布完成！其他裝置重新打開網站就會看到新版。'}else{localStorage.setItem(key+'-config',JSON.stringify(cfg));$('settings-status').textContent='已儲存。下載完整 HTML，即可帶到其他裝置。'}}catch(e){$('settings-status').textContent=e.message}finally{$('settings-save').disabled=false}};$('settings-export').onclick=async()=>{const c=await collectSettings();if(!c)return;cfg=c;const button=$('settings-export');button.disabled=true;$('settings-status').textContent='正在收集照片、音樂與字型，請保持網路連線，完成前不要關閉視窗…';try{await exportHtml();$('settings-status').textContent='已下載完整 HTML，包含照片、音樂與字型。玩家版從登入頁開始。'}catch(e){$('settings-status').textContent=e.message||'下載失敗，請重試。'}finally{button.disabled=false}}};

async function compressImage(file,keepSharp=false){if(keepSharp&&file.size<900*1024)return await new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(file)});const bmp=await createImageBitmap(file),max=keepSharp?1200:1100,scale=Math.min(1,max/Math.max(bmp.width,bmp.height)),canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(bmp.width*scale));canvas.height=Math.max(1,Math.round(bmp.height*scale));canvas.getContext('2d').drawImage(bmp,0,0,canvas.width,canvas.height);bmp.close();return canvas.toDataURL(keepSharp?'image/png':'image/jpeg',keepSharp?1:.78)}
async function readFile(id,current){const f=$(id)?.files?.[0];if(!f)return current;if(!['image/png','image/jpeg','image/gif','image/webp'].includes(f.type))throw new Error('請選擇 PNG、JPG、GIF 或 WebP 圖片。');if(f.size>12*1024*1024)throw new Error('單張圖片請小於 12 MB。');if(editMode)return compressImage(f,id==='set-qr');return await new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=()=>reject(new Error('圖片讀取失敗，請重新選擇。'));r.readAsDataURL(f)})}
async function readAudio(id,current){const f=$(id)?.files?.[0];if(!f)return current;if(!f.type.startsWith('audio/'))throw new Error('請選擇 MP3、M4A、WAV、OGG 或 WebM 音訊。');if(f.size>25*1024*1024)throw new Error('單首音樂請小於 25 MB。');return await new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=()=>reject(new Error('音訊讀取失敗，請重新選擇。'));r.readAsDataURL(f)})}
async function collectSettings(){const c=structuredClone(cfg);try{c.password=$('set-password').value.trim();if(!c.password)throw new Error('請填寫登入密碼。');c.alipayUrl=$('set-url').value.trim();if(c.alipayUrl&&!safeLink(c.alipayUrl))throw new Error('請填寫 HTTPS、alipay:// 或 alipays:// 開頭的正式連結。');c.letter=$('set-letter').value;c.shortLetter=$('set-short-letter').value;c.gameBgm=await readAudio('set-game-bgm',c.gameBgm);c.game4Bgm=await readAudio('set-game4-bgm',c.game4Bgm);c.endingBgm=await readAudio('set-ending-bgm',c.endingBgm);c.qrImage=await readFile('set-qr',c.qrImage);c.endingPhoto=await readFile('set-ending-photo',c.endingPhoto);for(let i=0;i<3;i++){c.clues[i].prompt=$('set-prompt-'+i).value;c.clues[i].photo=await readFile('set-clue-photo-'+i,c.clues[i].photo)}for(let i=0;i<4;i++)c.photos[i]=await readFile('set-photo-'+i,c.photos[i]);return c}catch(e){$('settings-status').textContent=e.message;return null}}
async function exportHtml(){
 const clone=document.documentElement.cloneNode(true),copy=structuredClone(cfg),assets=structuredClone(AS),cache=new Map();
 async function embed(src){
  if(!src||src.startsWith('data:'))return src;
  if(!cache.has(src))cache.set(src,(async()=>{const response=await fetch(new URL(src,location.href));if(!response.ok)throw new Error('素材下載失敗，請保持網路連線後重試。');const blob=await response.blob();return await new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.onerror=()=>reject(new Error('素材讀取失敗，請重試。'));reader.readAsDataURL(blob)})})());
  return cache.get(src);
 }
 for(const key of Object.keys(assets))assets[key]=await embed(assets[key]);
 for(const key of ['endingPhoto','qrImage','gameBgm','game4Bgm','endingBgm'])copy[key]=await embed(copy[key]);
 for(let i=0;i<copy.photos.length;i++)copy.photos[i]=await embed(copy.photos[i]);
 for(const clue of copy.clues)clue.photo=await embed(clue.photo);
 for(const style of clone.querySelectorAll('style')){let css=style.textContent;for(const match of [...css.matchAll(/url\(['"]?([^)'"\s]+)['"]?\)/g)]){if(!match[1].startsWith('data:'))css=css.replaceAll(match[0],`url("${await embed(match[1])}")`)}style.textContent=css;}
 copy.id='birthday-'+Date.now();copy.playerMode=true;
 clone.querySelector('#config').textContent=JSON.stringify(copy).replace(/</g,'\\u003c');
 clone.querySelector('#assets').textContent=JSON.stringify(assets).replace(/</g,'\\u003c');
 clone.querySelector('#app').replaceChildren();clone.querySelector('#stars').replaceChildren();
 clone.querySelector('#modal').removeAttribute('open');clone.querySelector('#modal-body').replaceChildren();
 clone.querySelector('#toast').classList.remove('show');clone.querySelector('#toast').textContent='';
 clone.querySelector('#sound-btn')?.remove();clone.querySelector('#gif-stars')?.remove();
 clone.querySelectorAll('.confetti,link[rel="manifest"]').forEach(el=>el.remove());
 const blob=new Blob(['<!doctype html>\n'+clone.outerHTML],{type:'text/html;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');
 a.href=url;a.download='Kyle的生日冒險.html';a.click();setTimeout(()=>URL.revokeObjectURL(url),30000);
}

function remotePayload(c){return {password:c.password,alipayUrl:c.alipayUrl,qrImage:c.qrImage,photos:c.photos,endingPhoto:c.endingPhoto,letter:c.letter,shortLetter:c.shortLetter,clues:c.clues.map(x=>({object:x.object,photo:x.photo,prompt:x.prompt,physical:x.physical}))}}
function applyRemote(data){if(!data||typeof data!=='object')return;for(const k of ['password','alipayUrl','qrImage','endingPhoto','letter','shortLetter'])if(typeof data[k]==='string')cfg[k]=data[k];if(Array.isArray(data.photos)&&data.photos.length===4)cfg.photos=data.photos;if(Array.isArray(data.clues)&&data.clues.length===3)cfg.clues=data.clues}
async function saveRemote(c){const res=await fetch('/api/config',{method:'POST',headers:{'Content-Type':'application/json','X-Editor-Password':editorPassword},body:JSON.stringify(remotePayload(c))});if(res.status===401){editorPassword='';throw new Error('管理密碼不正確，請重新打開設定。')}if(!res.ok){const out=await res.json().catch(()=>({}));throw new Error(out.error||'發布失敗，請稍後再試。')}return true}
async function boot(){if(location.protocol.startsWith('http')&&!location.hostname.endsWith('.github.io')){try{const res=await fetch('/api/config',{cache:'no-store'});if(res.ok)applyRemote(await res.json())}catch(e){}}renderLogin();if(editMode)toast('手機編輯模式已開啟，點右上角 ⚙ 開始修改。')}

for(let i=0;i<72;i++){const s=document.createElement('span');s.className='star '+(i%3?'tiny':'');s.textContent=i%3?'':'✦';s.style.left=(i*61.37%100)+'%';s.style.top=(i*37.13%100)+'%';s.style.setProperty('--speed',3+i%5+'s');s.style.setProperty('--delay',-i%7+'s');s.style.setProperty('--size',8+i%9+'px');$('stars').append(s)}
if(cfg.playerMode&&!editMode)$('settings-btn').classList.add('hidden');
const originalStars=document.createElement('img');originalStars.id='gif-stars';originalStars.className='stars-layer-gif';originalStars.src=AS.starGif;originalStars.alt='';document.body.prepend(originalStars);
boot();

</script></body></html>
